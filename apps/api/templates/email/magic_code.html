{% extends "email/base.html" %}

{% block content %}
<h2>{{ t('magic_code.heading', locale) }}</h2>
<p>{{ t('magic_code.intro', locale, org_name=org_name) }}</p>
<div class="code">{{ code }}</div>
<p class="muted">{{ t('magic_code.expiry', locale, expiry_minutes=expiry_minutes) }}</p>
<p class="muted">{{ t('magic_code.ignore', locale) }}</p>
{% endblock %}
