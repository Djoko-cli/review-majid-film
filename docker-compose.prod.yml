# ============================================================
# Review — Production Docker Compose
# ============================================================
# Pull-based deploy: this file only ever PULLS the image, already built and
# pushed to GHCR by .github/workflows/docker-build-push.yml — there is no
# `build:` directive anywhere below, and no source tree needed on the host
# you deploy to. See docs/deployment.md.
#
#   cp .env.example .env.prod        # once, then edit with your real values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# No Traefik/ACME here. `review` exposes one plain-HTTP port (its own
# internal Caddy splits it between web and api — see docker/Caddyfile) and
# expects a reverse proxy already running on the host — e.g. Synology DSM's
# own Login Portal > Advanced > Reverse Proxy — to terminate TLS and route
# your domain to it.
# ============================================================

services:
  # The whole app tier in one container: internal Caddy + web (Next.js) +
  # api (gunicorn) + Celery (worker/email_worker/maintenance_worker/beat).
  # See docker/entrypoint.sh for how they're supervised together, and the
  # Dockerfile at the repo root for the image itself. Postgres/Redis/MinIO
  # stay separate services — real stateful dependencies with their own
  # upgrade/backup/healthcheck lifecycle, unlike the stateless app tier.
  review:
    container_name: review
    image: ghcr.io/djoko-cli/review-majid-film:latest
    restart: unless-stopped
    # Docker's built-in tini as PID 1 — reaps zombies from the several
    # background processes entrypoint.sh starts inside this one container.
    init: true
    env_file:
      - .env.prod
    environment:
      - DISABLE_DOCS=true
    depends_on:
      review-postgres:
        condition: service_healthy
      review-redis:
        condition: service_healthy
      review-minio:
        condition: service_healthy
    # "M family" brand-slide sync (BRAND_SYNC_ENABLED in .env.prod): reads
    # majid.film's own deployed build output, read-only. Comment out if this
    # deploy doesn't sync brand photography.
    volumes:
      - /volume2/web/majidfilm:/mnt/majidfilm:ro
    ports:
      - "${PROXY_PORT:-6200}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - review

  review-postgres:
    container_name: review-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - /volume2/docker/review/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-review}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - review

  review-redis:
    container_name: review-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi"
    env_file:
      - .env.prod
    volumes:
      - /volume2/docker/review/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - review

  # ─── Self-hosted object storage ────────────────────────────────────────
  # Review has NO local-filesystem storage backend — it speaks only the S3
  # API. Presigned URLs are handed to the browser, so MinIO must be reachable
  # from OUTSIDE this compose stack on its own host port, fronted by its own
  # reverse-proxy rule (storage.<your-domain> -> localhost:${MINIO_PORT}),
  # exactly like `review` above. The app creates the bucket itself on boot
  # (apps/api/services/s3_service.py:run_startup_bucket_setup, retries,
  # never crashes the app) — no separate init container needed for that.
  review-minio:
    container_name: review-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # 2025+ supports the boto3>=1.36 checksums
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.prod
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_CORS_ALLOW_ORIGIN: ${FRONTEND_URL}
      MINIO_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE,HEAD
      MINIO_CORS_ALLOW_HEADERS: "*"
      MINIO_CORS_EXPOSE_HEADERS: ETag,Content-Length,x-amz-request-id
    volumes:
      - /volume2/docker/review/data/minio:/data
    ports:
      - "${MINIO_PORT:-6201}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - review

# Named network, not Compose's auto-generated `<dir>_default` — reads the
# same in `docker network ls` / DSM's Container Manager as any other
# deliberately-named stack (Transfer's own `transfer` network, same pattern).
networks:
  review:
    name: review
    driver: bridge
